# gitleaks configuration, used by the secret-scan job in .github/workflows/ci.yml.
# Keep the allowlists narrow: never allowlist a directory or a whole rule.
title = "didit-protocol/sdk-python"

[extend]
useDefault = true

[[allowlists]]
description = "Upstream copies, synced byte for byte by the spec sync workflow and never edited by hand"
paths = [
  '''^openapi/verification\.json$''',
  '''^openapi/account\.json$''',
  '''^openapi/authentication\.json$''',
  '''^openapi/webhook-vectors\.json$''',
]

[[allowlists]]
description = "Earlier upstream copies of openapi/verification.json, pinned by commit for the spec sync classification tests"
paths = [
  '''^codegen/tests/fixtures/verification-[0-9a-f]{40}\.json$''',
]

[[allowlists]]
description = "Synthetic webhook secrets used by the test suite"
regexes = [
  '''^whsec_test_[A-Za-z0-9_]+$''',
]
