# NOTHING MAY BE PUBLISHED before Alex's explicit approval and the 2026-11-01 Didit release
# (docs/DESIGN.md section 13). The PyPI environment `pypi` used by release.yml must require
# a reviewer.
#
# release-please opens the release pull request (version bump and the generated
# CHANGELOG.md) and, once that pull request is merged and this workflow runs again, creates
# the tag and the GitHub release, which starts release.yml. It runs only when started by
# hand, so nothing is cut by accident.
#
# Token: a release or pull request created with the default GITHUB_TOKEN does not trigger
# other workflows, so release.yml would not start and the release pull request would get
# no CI. Add a repository secret RELEASE_PLEASE_TOKEN (a fine-grained token with Contents,
# Issues and Pull requests read and write on this repository only) to fix that; without it
# the workflow falls back to GITHUB_TOKEN.
name: Release Please

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
