# Continuous integration for the Didit Python SDK (docs/DESIGN.md section 11).
# Every third-party action is pinned by full commit SHA; Dependabot keeps the pins current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs also start the live smoke tests (job live-smoke) when the
  # DIDIT_SANDBOX_API_KEY secret is set.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs of a pull request; every push to main gets its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  # Use uv.lock exactly as committed. The lint job checks that it matches pyproject.toml.
  UV_FROZEN: "1"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check that uv.lock matches pyproject.toml
        run: UV_FROZEN= uv lock --check
      - name: Install dependencies
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format --check
        run: uv run ruff format --check .

  typecheck:
    name: Type check (mypy, pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install dependencies
        run: uv sync --frozen
      - name: mypy --strict
        run: uv run mypy
      - name: pyright
        run: uv run pyright

  codegen:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install dependencies
        run: uv sync --frozen
      - name: Regenerate and compare with the committed code
        # Fails when src/didit/types, src/didit/resources or tests/generated differ from
        # what codegen/ produces from openapi/. Fix: uv run python codegen/generate.py
        run: uv run python codegen/generate.py --check

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Adds the coverage gate to the existing Linux 3.12 job.
          - os: ubuntu-latest
            python-version: "3.12"
            coverage: true
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: pytest
        if: ${{ !matrix.coverage }}
        run: uv run pytest -m "not live"
      - name: pytest with the core coverage gate (90 %)
        if: ${{ matrix.coverage }}
        run: uv run pytest -m "not live" --cov --cov-report=term-missing --cov-fail-under=90

  build:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build the sdist and the wheel
        run: uv build
      - name: Install the wheel into a fresh virtual environment
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv" dist/*.whl
      - name: Import didit without the optional cryptography dependency
        # Run outside the checkout so that the import resolves to the installed wheel.
        working-directory: ${{ runner.temp }}
        run: |
          py="$RUNNER_TEMP/wheel-venv/bin/python"
          if "$py" -c "import cryptography" 2>/dev/null; then
            echo "::error::cryptography is installed without the auth extra; it must stay optional (didit-sdk[auth])."
            exit 1
          fi
          "$py" -c "import didit; print(didit.__version__)"

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The official gitleaks-action needs a paid licence for organisations, so the
      # release binary is downloaded and verified against its published SHA-256.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out the repository with its full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan every commit
        # `gitleaks git` is the current name of `gitleaks detect` (deprecated in 8.19).
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose --no-banner .'

  live-smoke:
    name: Live smoke tests (sandbox)
    # Never part of default CI (docs/DESIGN.md section 11): manual runs only, and only
    # when the DIDIT_SANDBOX_API_KEY repository secret is set.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for the sandbox API key
        id: key
        env:
          DIDIT_SANDBOX_API_KEY: ${{ secrets.DIDIT_SANDBOX_API_KEY }}
        run: |
          if [ -n "$DIDIT_SANDBOX_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DIDIT_SANDBOX_API_KEY is not set; the live smoke tests are skipped."
          fi
      - name: Check out the repository
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        if: steps.key.outputs.present == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: uv sync --frozen
      - name: pytest -m live
        if: steps.key.outputs.present == 'true'
        # The key reaches only this step, through the environment; it is never printed.
        # Optional repository variables: DIDIT_SANDBOX_WORKFLOW_ID, DIDIT_SANDBOX_BASE_URL.
        env:
          DIDIT_SANDBOX_API_KEY: ${{ secrets.DIDIT_SANDBOX_API_KEY }}
          DIDIT_SANDBOX_WORKFLOW_ID: ${{ vars.DIDIT_SANDBOX_WORKFLOW_ID }}
          SANDBOX_BASE_URL: ${{ vars.DIDIT_SANDBOX_BASE_URL }}
        run: |
          if [ -n "$SANDBOX_BASE_URL" ]; then
            export DIDIT_SANDBOX_BASE_URL="$SANDBOX_BASE_URL"
          fi
          uv run pytest -m live
