# NOTHING MAY BE PUBLISHED before Alex's explicit approval and the 2026-11-01 Didit release
# (docs/DESIGN.md section 13). The GitHub environment `pypi` must require a reviewer, so
# that every upload to PyPI waits for an explicit approval.
#
# Publishes didit-sdk to PyPI with trusted publishing (OIDC, no API token) when a GitHub
# release is published. The PyPI project must list this repository, the workflow
# release.yml and the environment pypi as a trusted publisher.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # No dependency cache in the release build.
          enable-cache: false
      - name: Check that the release tag matches the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --no-project python - <<'PY'
          import os
          import pathlib
          import re
          import sys
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          text = pathlib.Path("src/didit/_version.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"', text, re.MULTILINE)
          if match is None:
              print("::error::Could not read __version__ from src/didit/_version.py")
              sys.exit(1)
          version = match.group(1)
          pyproject = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          project_version = tomllib.loads(pyproject)["project"]["version"]

          problems = []
          if tag != f"v{version}":
              problems.append(
                  f"Release tag {tag!r} does not match src/didit/_version.py "
                  f"({version}); expected 'v{version}'."
              )
          if project_version != version:
              problems.append(
                  f"pyproject.toml version {project_version} does not match "
                  f"src/didit/_version.py ({version})."
              )
          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          print(f"Release tag {tag} matches version {version}.")
          PY
      - name: Build the sdist and the wheel
        run: uv build
      - name: Upload the distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      # Must require a reviewer (Settings > Environments > pypi > Required reviewers).
      name: pypi
      url: https://pypi.org/project/didit-sdk/
    permissions:
      id-token: write # trusted publishing (OIDC)
    steps:
      - name: Download the distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
