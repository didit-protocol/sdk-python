name: Feature request
description: Suggest an improvement to the Didit Python SDK.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The SDK is generated from the public Didit API, so a missing API capability is a
        request for the API itself; describe it here anyway and we will route it.
        Do not paste API keys, secrets or personal data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API you would like, ideally as a short code example.
      render: python
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, related issues, or other Didit SDKs (Node, Go, Java, PHP, Ruby, .NET) where this matters too.
